name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bps
          POSTGRES_PASSWORD: bps
          POSTGRES_DB: bps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bps -d bps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bps:bps@localhost:5432/bps_test
      TEST_DATABASE_URL: postgresql+psycopg://bps:bps@localhost:5432/bps_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      # = `make check` minus web-check, which the `web` job runs.
      - run: make lint typecheck test build

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Generated client (src/lib/api/schema.d.ts) must match openapi.json.
      - run: pnpm check:api
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Playwright e2e against `pnpm start` (API mocked by route interception; real stack in U7).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose --profile ui config --quiet
      - run: docker compose build
      - name: Image runs as non-root
        run: test "$(docker compose run --rm -T --no-deps -e BPS_MIGRATE_ON_START=0 app id -u)" != "0"
      - name: bps --help (migrates on start)
        run: docker compose run --rm app bps --help
      - name: Fresh DB is migrated on container start
        run: |
          docker compose down -v
          docker compose run --rm app bps status --max-dead 0
      - name: Scheduler loop starts and keeps running
        run: |
          BPS_SCHEDULE_INTERVAL=600 docker compose up -d scheduler
          sleep 20
          docker compose logs scheduler
          docker compose ps --status running --services | grep -qx scheduler
          docker compose logs scheduler | grep -q "scheduler: sleeping 600s"
      - if: always()
        run: docker compose down -v

  # UI stack smoke (U7): production images (api = main image + `bps serve --workers`, web =
  # Next standalone), compose `ui` profile, DB seeded from the recorded fixtures, Playwright
  # (web/e2e-stack/) against the real stack — nothing mocked.
  e2e-stack:
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose --profile ui build
      - name: Web image runs as non-root, small
        run: |
          test "$(docker run --rm --entrypoint id bps-web:latest -u)" != "0"
          docker image ls bps-web:latest
      - name: Start db
        run: docker compose --profile ui up -d --wait db
      - name: Seed from fixtures (migrates on start; no BPS calls)
        run: |
          docker compose run --rm -v "$PWD/tests/fixtures:/fixtures:ro" app \
            bps seed-fixtures /fixtures
          docker compose run --rm app bps status --max-dead 0
      - name: Start api + web (waits for healthchecks)
        run: docker compose --profile ui up -d --wait api web
      - name: Same-origin /api proxy answers
        run: curl -fsS http://127.0.0.1:3000/api/health | tee /dev/stderr | grep -q '"database":"ok"'
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: Playwright stack smoke
        run: pnpm e2e:stack
        working-directory: web
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
      - if: failure()
        run: docker compose --profile ui logs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-stack-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
      - if: always()
        run: docker compose --profile ui down -v
