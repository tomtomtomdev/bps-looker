name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bps
          POSTGRES_PASSWORD: bps
          POSTGRES_DB: bps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bps -d bps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bps:bps@localhost:5432/bps_test
      TEST_DATABASE_URL: postgresql+psycopg://bps:bps@localhost:5432/bps_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: make check

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Image runs as non-root
        run: test "$(docker compose run --rm -T --no-deps -e BPS_MIGRATE_ON_START=0 app id -u)" != "0"
      - name: bps --help (migrates on start)
        run: docker compose run --rm app bps --help
      - name: Fresh DB is migrated on container start
        run: |
          docker compose down -v
          docker compose run --rm app bps status --max-dead 0
      - name: Scheduler loop starts and keeps running
        run: |
          BPS_SCHEDULE_INTERVAL=600 docker compose up -d scheduler
          sleep 20
          docker compose logs scheduler
          docker compose ps --status running --services | grep -qx scheduler
          docker compose logs scheduler | grep -q "scheduler: sleeping 600s"
      - name: Read API answers /health
        run: |
          docker compose up -d api
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1
      - if: always()
        run: docker compose down -v
