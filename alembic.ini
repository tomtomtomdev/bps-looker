# Alembic CLI config (`uv run alembic upgrade head`, or `make migrate`).
# The database URL is NOT set here: env.py reads DATABASE_URL (env or .env) via Settings.
[alembic]
script_location = %(here)s/src/bps_fetcher/db/migrations
prepend_sys_path = .
# New revisions: `uv run alembic revision --autogenerate --rev-id 0002 -m "..."`
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
