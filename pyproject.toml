[project]
name = "bps-fetcher"
version = "0.1.0"
description = "Crawl the BPS (Statistics Indonesia) WebAPI into Postgres"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiolimiter>=1.3.0",
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
bps = "bps_fetcher.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.23.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bps_fetcher"]

[tool.hatch.build.targets.sdist]
# The Next.js app is not part of the Python package (and its node_modules is huge).
exclude = ["/web"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls the real BPS WebAPI (needs BPS_API_KEY); run with `make live`",
]
