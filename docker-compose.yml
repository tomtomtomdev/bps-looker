# Services:
#   db         Postgres 16, data in the `pgdata` volume (only published on 127.0.0.1).
#   app        one-off commands: `docker compose run --rm app bps seed indicators` etc.
#   scheduler  long-running loop: `bps seed refresh` + `bps work --drain` every BPS_SCHEDULE_INTERVAL s.
#   api        read-only HTTP API for the web UI (`bps serve`), published on 127.0.0.1:8000.
#   web        Next.js UI (web/), published on 127.0.0.1:3000; its browser code calls the api.
# Every container migrates the DB to head on start (bps_fetcher.entrypoint), then runs its command.
# Secrets come from .env (never baked into the image); DATABASE_URL always points at `db`.

x-bps: &bps
  build: .
  image: bps-fetcher:latest
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bps}:${POSTGRES_PASSWORD:-bps}@db:5432/${POSTGRES_DB:-bps}
  depends_on:
    db:
      condition: service_healthy
  init: true

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bps}
      POSTGRES_DB: ${POSTGRES_DB:-bps}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    <<: *bps
    profiles: ["tools"]
    command: ["bps", "--help"]

  scheduler:
    <<: *bps
    restart: unless-stopped
    # One iteration: schedule what is due, drain the queue (also picks up anything seeded by
    # hand), log status. A failing step never stops the loop; the next iteration retries.
    # BPS_* knobs are interpolated by compose from the shell env or .env.
    command:
      - sh
      - -c
      - |
        while true; do
          echo "scheduler: run started $$(date -u +%FT%TZ)"
          bps seed refresh
          bps work --drain --drain-wait ${BPS_DRAIN_WAIT:-300}
          bps status --max-dead ${BPS_MAX_DEAD:-0} || echo "scheduler: status ALERT (exit $$?)"
          echo "scheduler: sleeping ${BPS_SCHEDULE_INTERVAL:-3600}s"
          sleep ${BPS_SCHEDULE_INTERVAL:-3600}
        done

  api:
    <<: *bps
    restart: unless-stopped
    # The scheduler migrates on start; two concurrent Alembic upgrades on a fresh DB could race,
    # so the read-only API skips it (/health reports the DB revision, null until migrated).
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bps}:${POSTGRES_PASSWORD:-bps}@db:5432/${POSTGRES_DB:-bps}
      BPS_MIGRATE_ON_START: "0"
      BPS_WEB_ORIGIN: ${BPS_WEB_ORIGIN:-http://localhost:3000}
    command: ["bps", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${BPS_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    # Simple build + `next start` (web/Dockerfile); production image + e2e come in U7.
    build:
      context: ./web
      args:
        # Inlined at build time: the API URL as seen from the *browser*, not from the container.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: bps-web:latest
    restart: unless-stopped
    init: true
    depends_on:
      - api
    ports:
      - "127.0.0.1:${BPS_WEB_PORT:-3000}:3000"

volumes:
  pgdata:
