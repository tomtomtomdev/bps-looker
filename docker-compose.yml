# Services:
#   db         Postgres 16, data in the `pgdata` volume (only published on 127.0.0.1).
#   app        one-off commands: `docker compose run --rm app bps seed indicators` etc.
#   scheduler  long-running loop: `bps seed refresh` + `bps work --drain` every BPS_SCHEDULE_INTERVAL s.
#   api        [profile ui] read-only HTTP API for the web UI (`bps serve`, uvicorn workers),
#              published on 127.0.0.1:8000 (debugging / direct use; the UI doesn't need it).
#   web        [profile ui] Next.js UI (web/, standalone image), published on 127.0.0.1:3000.
#              The browser calls same-origin /api/*, which the web server proxies to
#              BPS_API_INTERNAL_URL (http://api:8000) — put a reverse proxy in front of `web` only.
#   docker compose --profile ui up -d     # db + scheduler + api + web
# Every container migrates the DB to head on start (bps_fetcher.entrypoint), then runs its command.
# Secrets come from .env (never baked into the image); DATABASE_URL always points at `db`.

x-bps: &bps
  build: .
  image: bps-fetcher:latest
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bps}:${POSTGRES_PASSWORD:-bps}@db:5432/${POSTGRES_DB:-bps}
  depends_on:
    db:
      condition: service_healthy
  init: true

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bps}
      POSTGRES_DB: ${POSTGRES_DB:-bps}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    <<: *bps
    profiles: ["tools"]
    command: ["bps", "--help"]

  scheduler:
    <<: *bps
    restart: unless-stopped
    # One iteration: schedule what is due, drain the queue (also picks up anything seeded by
    # hand), log status. A failing step never stops the loop; the next iteration retries.
    # BPS_* knobs are interpolated by compose from the shell env or .env.
    command:
      - sh
      - -c
      - |
        while true; do
          echo "scheduler: run started $$(date -u +%FT%TZ)"
          bps seed refresh
          bps work --drain --drain-wait ${BPS_DRAIN_WAIT:-300}
          bps status --max-dead ${BPS_MAX_DEAD:-0} || echo "scheduler: status ALERT (exit $$?)"
          echo "scheduler: sleeping ${BPS_SCHEDULE_INTERVAL:-3600}s"
          sleep ${BPS_SCHEDULE_INTERVAL:-3600}
        done

  api:
    <<: *bps
    profiles: ["ui"]
    restart: unless-stopped
    # The scheduler migrates on start; two concurrent Alembic upgrades on a fresh DB could race,
    # so the read-only API skips it (/health reports the DB revision, null until migrated).
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bps}:${POSTGRES_PASSWORD:-bps}@db:5432/${POSTGRES_DB:-bps}
      BPS_MIGRATE_ON_START: "0"
      BPS_WEB_ORIGIN: ${BPS_WEB_ORIGIN:-http://localhost:3000}
    command: ["bps", "serve", "--host", "0.0.0.0", "--port", "8000", "--workers", "${BPS_API_WORKERS:-2}"]
    ports:
      - "127.0.0.1:${BPS_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    # Production image (web/Dockerfile): standalone `node server.js`, non-root. The browser uses
    # same-origin /api (baked in, host-independent); the upstream is a runtime env var.
    profiles: ["ui"]
    build:
      context: ./web
    image: bps-web:latest
    restart: unless-stopped
    init: true
    environment:
      BPS_API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BPS_WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
